    text-decoration: none;
    transition: background 160ms;

  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-secondary {
    font-size: 14px; font-weight: 500;
    color: var(--color-text-muted);
    text-decoration: none;
    padding: 12px 8px;
  }
  .btn-secondary:hover { color: var(--color-primary); }
  .code {
